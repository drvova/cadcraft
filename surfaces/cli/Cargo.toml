[package]
name = "cadcraft-cli"
description = "CADCraft's command-line tool with the designed surfaces: `run --card`, `run --sheet`, the `tui` dashboard and `(card)` in its MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# The same program as apps/cadcraft-cli, from the same source file, with its `surfaces` feature
# on: this manifest adds what that needs (the surface crate, Slab's terminal driver).
[[bin]]
name = "cadcraft-cli"
path = "../../apps/cadcraft-cli/src/main.rs"

[features]
default = ["surfaces"]
surfaces = []

[dependencies]
cadcraft-engine = { workspace = true }
cadcraft-io = { workspace = true }
cadcraft-mcp = { workspace = true }
cadcraft-render = { workspace = true }
serde_json = { workspace = true }
cadcraft-surface = { workspace = true }
# Slab's terminal driver (MIT; crossterm underneath): raw mode, keys to kernel events, and the
# cell painter for `cadcraft-cli tui`. The terminal lives here, in the app, not in a library crate.
slab-tui = { workspace = true }
