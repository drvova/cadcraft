[package]
name = "cadcraft-cli"
description = "CADCraft command-line tool: info, convert, run scripts, export, commands, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# The designed surfaces: `run --card`, `run --sheet`, the `tui` dashboard, and `(card)` in the
# MCP server (docs/surfaces.md). Off by default, because they are built on Slab, which is fetched
# and patched by `cargo xtask slab`: build them with `cargo xtask surfaces build`, never with a
# bare `--features surfaces` (that compiles unpatched Slab, which does not build).
surfaces = ["dep:cadcraft-surface", "cadcraft-surface/slab", "cadcraft-mcp/surfaces", "dep:slab-tui"]

[dependencies]
cadcraft-engine = { workspace = true }
cadcraft-io = { workspace = true }
cadcraft-mcp = { workspace = true }
cadcraft-render = { workspace = true }
serde_json = { workspace = true }
cadcraft-surface = { workspace = true, optional = true }
# Slab's terminal driver (MIT; crossterm underneath): raw mode, keys to kernel events, and the
# cell painter for `cadcraft-cli tui`. The terminal lives here, in the app, not in a library crate.
slab-tui = { workspace = true, optional = true }
