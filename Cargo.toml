[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# `apps/ui` is the SolidJS interface: a bun app, not a Rust crate, so the `apps/*` member glob
# must not try to load it as one. `third_party/slab/src` is Slab's own workspace, fetched there
# by `cargo xtask slab` (absent on a fresh clone): its crates must find their own root, not this.
exclude = ["apps/ui", "third_party/slab/src"]
# default-members

[workspace.package]
version = "0.13.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/cadcraft"

[workspace.dependencies]
# internal
cadcraft-geom = { path = "crates/geom" }
cadcraft-dxf = { path = "crates/dxf" }
cadcraft-dwg = { path = "crates/dwg" }
cadcraft-color = { path = "crates/color" }
cadcraft-doc = { path = "crates/doc" }
cadcraft-constraints = { path = "crates/constraints" }
cadcraft-fonts = { path = "crates/fonts" }
cadcraft-render = { path = "crates/render" }
cadcraft-io = { path = "crates/io" }
cadcraft-engine = { path = "crates/engine" }
cadcraft-mcp = { path = "crates/mcp" }
cadcraft-ai = { path = "crates/ai" }
cadcraft-wasm = { path = "crates/wasm" }
cadcraft-surface = { path = "crates/surface" }
# Slab (MIT, https://github.com/stencil-hq/slab): the design language the surfaces are written in
# (compiler, kernel, static exporters, terminal driver). Pre-alpha and not on crates.io, so it is
# named by git at the commit `third_party/slab/SLAB.lock` pins. Every use is optional (the
# `slab` feature of `cadcraft-surface`, `surfaces` of the command-line tool and the MCP server):
# a default build compiles none of it.
#
# The commit named here does not build as it is and embeds fonts; CADCraft builds it through the
# patch series in `third_party/slab/patches`. `cargo xtask slab` fetches the commit into the
# git-ignored `third_party/slab/src`, applies the series and writes a Cargo `paths` override;
# `cargo xtask surfaces test|clippy|build|run` passes it (third_party/slab/README.md).
# `default-features = false` is what leaves Slab's bundled fonts out.
#
# When the fork exists: put its URL and the hash of its patched commit in these six lines, and
# delete the fetch step. Nothing else changes.
slab-compile = { git = "https://github.com/stencil-hq/slab", rev = "65747371a18da9a54a94955473d0ec7f7fd07d5f", default-features = false }
slab-fonts = { git = "https://github.com/stencil-hq/slab", rev = "65747371a18da9a54a94955473d0ec7f7fd07d5f", default-features = false }
slab-kernel = { git = "https://github.com/stencil-hq/slab", rev = "65747371a18da9a54a94955473d0ec7f7fd07d5f", default-features = false }
slab-slir = { git = "https://github.com/stencil-hq/slab", rev = "65747371a18da9a54a94955473d0ec7f7fd07d5f", default-features = false }
slab-syntax = { git = "https://github.com/stencil-hq/slab", rev = "65747371a18da9a54a94955473d0ec7f7fd07d5f" }
slab-tui = { git = "https://github.com/stencil-hq/slab", rev = "65747371a18da9a54a94955473d0ec7f7fd07d5f", default-features = false }
# Which paths stored in a drawing (xrefs, data links) may be opened.
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "a0916808f7d78bed8c7b90cdf937176015454a7f" }
# PDF writing (krilla) for plots, and reading them back in tests. The root patches below pin
# craft-pdf's patched backends to the same revision (Cargo ignores dependency-local patches).
craft-pdf = { version = "=0.1.0", git = "https://github.com/storytold/craft-libs", rev = "a0916808f7d78bed8c7b90cdf937176015454a7f", default-features = false }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rayon = "1"

# rendering / formats
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
lyon_tessellation = "1.0.22"
skrifa = "0.48"
# Text shaping (OpenType GSUB/GPOS, HarfBuzz port on read-fonts) and the Unicode Bidirectional
# Algorithm for right-to-left drawing text.
harfrust = "0.14"
unicode-bidi = "0.3.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
encoding_rs = "0.8.35"
# XML for the SVG reader (streaming parser, no entity expansion beyond the five predefined ones)
quick-xml = "0.42"


[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# The browser build ships over the network, so it trades build time for size (opt-level "z",
# fat LTO, one codegen unit). `panic` stays unwinding: the engine's last-resort guard is
# `catch_unwind`, which a panic strategy of `abort` would remove.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1

# PDF backends for craft-pdf: pinned to the same reviewed craft-libs revision as craft-pdf itself
# (Cargo ignores dependency-local patches).
[patch.crates-io]
krilla = { version = "=0.8.2", git = "https://github.com/storytold/craft-libs", rev = "a0916808f7d78bed8c7b90cdf937176015454a7f" }
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "a0916808f7d78bed8c7b90cdf937176015454a7f" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "a0916808f7d78bed8c7b90cdf937176015454a7f" }
